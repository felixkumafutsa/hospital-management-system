services:
  - type: web
    name: betterlife-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      # add all your other env vars here

  - type: web
    name: betterlife-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npx serve dist
    envVars:
      - key: VITE_API_URL
        sync: false # your API's Render URL will go here